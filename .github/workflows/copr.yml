name: COPR Release Build

on:
  release:
    types: [published]

jobs:
  trigger-copr:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger COPR build
        run: |
          curl --fail --silent --show-error \
            -X POST "$COPR_WEBHOOK_URL"
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
