name: COPR Release Build

on:
  # Allow a manual COPR build from the Actions tab.
  workflow_dispatch:

  # The upstream LH4051-DE repository sends this event after publishing a release.
  repository_dispatch:
    types: [lh4051-de-release]

jobs:
  trigger-copr:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger COPR build
        run: |
          curl --fail --silent --show-error \
            -X POST "$COPR_WEBHOOK_URL"
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
